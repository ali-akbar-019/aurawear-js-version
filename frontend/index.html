<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>AuraWear AI – Smart Fashion Tailored for You</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="AuraWear AI is an intelligent fashion platform that uses artificial intelligence to recommend clothing tailored to your body type, skin tone, style, and lifestyle. Shop smarter. Dress better."
    />

      name="keywords"
      content="AI fashion, smart clothing, personalized fashion, online clothing store, AI outfit recommendations, fashion tech, AuraWear"
    />
    <meta name="author" content="AuraWear AI" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="AuraWear AI – Smart Fashion Tailored for You"
    />

      property="og:description"
      content="Discover clothing curated by AI to match your body, style, and personality. Experience the future of fashion with AuraWear AI."

    <meta property="og:url" content="https://www.aurawear.ai" />

      name="twitter:title"
      content="AuraWear AI – Smart Fashion Tailored for You"
    />
    <meta
      name="twitter:description"
      content="AI-powered clothing recommendations designed just for you. Shop smarter with AuraWear AI."
    />

    <!-- Theme / Branding -->
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/woman.png" />
